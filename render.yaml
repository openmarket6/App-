# Render Blueprint for One Contractor Solutions.
#
# Two services from one repository:
#   one-contractor-solutions -- the HTTP API *and* the frontend. It serves the contractor
#                  portal at / and the permit intake form at /intake, so the
#                  whole product is one deployment on one domain: no CORS to
#                  configure, and the UI can never be a different version from
#                  the API it talks to.
#   one-contractor-worker    -- background jobs: municipal status checks, expiry reminders,
#                  notification delivery, webhook processing
#
# The worker is a SEPARATE service, not a thread inside the API, so a slow
# municipal portal cannot compete with page loads, and either can be restarted
# or scaled without disturbing the other.
#
# Every secret below is `sync: false`, meaning Render prompts for it and stores
# it encrypted. No credential belongs in this file or anywhere else in git.
#
# Postgres and file storage live in Supabase, not here.

services:
  - type: web
    name: one-contractor-solutions
    runtime: node
    plan: starter
    region: ohio
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start

    # Render polls this and pulls the instance out of rotation if it fails,
    # rather than killing the container the way a failing /healthz would.
    healthCheckPath: /readyz

    # Migrations run once per deploy, before the new instance takes traffic.
    # (Paid plans only. On the free plan, use:
    #    startCommand: npm run migrate && npm start
    #  -- the advisory lock in the migration runner makes concurrent boots safe.)
    preDeployCommand: npm run migrate

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: LOG_LEVEL
        value: info

      # --- URLs -------------------------------------------------------------
      - key: API_BASE_URL
        sync: false          # https://ocs-api.onrender.com (or your domain)
      - key: APP_BASE_URL
        sync: false          # https://one-contractor-solutions.netlify.app
      # Only needed if a SEPARATE frontend (e.g. the existing Netlify site)
      # also calls this API. The built-in portal is same-origin and needs no
      # entry here. Exact origins, comma-separated. Never "*".
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # --- Database ---------------------------------------------------------
      # Three Supabase connection strings, differing only in the role:
      #   DATABASE_URL           -> ocs_app      (request handling, one tenant)
      #   DATABASE_SERVICE_URL   -> ocs_service  (background work, cross-tenant)
      #   DATABASE_MIGRATION_URL -> postgres     (owner; DDL only)
      # Use the SESSION pooler (port 5432), not the transaction pooler:
      # tenant isolation relies on SET LOCAL inside a transaction, and the
      # transaction pooler can hand the statements to different backends.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SERVICE_URL
        sync: false
      - key: DATABASE_MIGRATION_URL
        sync: false

      # --- Supabase auth + storage -----------------------------------------
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false          # secret: signs storage URLs. Never sent to a browser.
      - key: SUPABASE_STORAGE_BUCKET
        value: ocs-documents

      # --- Payments ---------------------------------------------------------
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false

      # --- Email (optional) -------------------------------------------------
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false

      # --- Physical mail (Lob) ----------------------------------------------
      #
      # On the API only. The worker sends no mail: posting is triggered from a
      # request, by a person who has just produced the document, and giving the
      # worker a mail key it never uses would only widen what a compromised
      # worker could do.
      #
      # BOTH of the first two are required. A key with no webhook secret can
      # post certified mail and never hear that it arrived -- which is precisely
      # the fact the certified mail was bought to establish -- so the API treats
      # one-without-the-other as unconfigured and refuses to send.
      #
      # Test and live have DIFFERENT webhook secrets. Moving LOB_API_KEY to a
      # live key without swapping LOB_WEBHOOK_SECRET in the same deploy leaves
      # letters going out and every delivery event rejected as forged.
      - key: LOB_API_KEY
        sync: false
      - key: LOB_WEBHOOK_SECRET
        sync: false
      # Where the signed green card and any return-to-sender come back to.
      # Not optional for certified mail: without it a letter can be delivered
      # perfectly and still prove nothing, so the send endpoint refuses.
      - key: MAIL_RETURN_NAME
        sync: false
      - key: MAIL_RETURN_LINE1
        sync: false
      - key: MAIL_RETURN_LINE2
        sync: false
      - key: MAIL_RETURN_CITY
        sync: false
      - key: MAIL_RETURN_STATE
        sync: false
      - key: MAIL_RETURN_POSTAL_CODE
        sync: false

      # --- Authentication ---------------------------------------------------
      # Email/password sign-in for the existing React frontend. Render generates
      # both and stores them encrypted, so no secret is ever committed.
      #
      # Two separate values on purpose: an access token leaked from a browser
      # must not be usable to mint refresh tokens.
      #
      # Changing either signs everyone out. Intended behaviour, but do not
      # rotate them casually.
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: AUTH_REFRESH_SECRET
        generateValue: true

      # --- Security ---------------------------------------------------------
      - key: INTEGRATION_ENCRYPTION_KEY
        generateValue: true  # Render generates and stores it; never seen in git
      - key: RATE_LIMIT_MAX
        value: 300

  - type: worker
    name: one-contractor-worker
    runtime: node
    plan: starter
    region: ohio
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm run start:worker

    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: WORKER_ENABLED
        value: true
      - key: WORKER_CONCURRENCY
        value: 4

      # The worker does not run migrations -- the API's pre-deploy step owns
      # that, so there is exactly one migrating process per deploy.
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SERVICE_URL
        sync: false

      - key: APP_BASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: ocs-documents
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false          # must match the API's value exactly
      # The worker serves no sign-ins, so it needs no auth secrets.
