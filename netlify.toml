# Netlify configuration — frontend only.
#
# ARCHITECTURE
#   Netlify  serves the React application (this file publishes `public/`)
#   Render   runs the API and the background worker
#
# The background worker is why the backend is not here. It runs continuously,
# watching a job queue for permit status checks, licence-expiry reminders and
# notification delivery. Netlify Functions are short-lived by design, so there
# is nowhere for a process like that to live — which is exactly why those
# scheduled checks never fired in the previous all-Netlify build.

[build]
  publish = "public"
  # The application is COMPILED HERE, from web/. It used to be a bundle someone
  # built once and committed, with no source in the repository at all -- which
  # meant the screen could never change no matter what the backend gained. Every
  # endpoint added after that build was invisible, and nobody could tell from
  # looking at the site that anything was missing.
  #
  # `vite build` writes into ../public alongside the hand-written marketing
  # pages and rewrites app.html with the current content-hashed asset names, so
  # the deployed interface is now always the interface in this repository.
  #
  # `npm ci` rather than `npm install`: it installs exactly what
  # web/package-lock.json records, so a transitive dependency publishing a bad
  # release cannot change what gets deployed on a day nobody touched the code.
  #
  # The marketing pages are generated too. They carry the price list, and a
  # deploy that rebuilt the application but left last week's pricing on
  # /pricing would be quietly wrong in the one place a prospect looks.
  command = "npm ci --omit=dev --ignore-scripts && node scripts/build-site.mjs && cd web && npm ci && npm run build"

[build.environment]
  # Pinned so a Netlify default bump cannot break the build on an unrelated day.
  NODE_VERSION = "20"

# -----------------------------------------------------------------------------
# THE IMPORTANT PART: proxy /api/* to Render.
#
# `status = 200` makes this a PROXY, not a redirect. The browser believes it is
# talking to the Netlify origin the whole time, and never learns the API lives
# somewhere else.
#
# That is not a convenience — it is required for sign-in to work at all:
#
#   The refresh-token cookie is set httpOnly with SameSite=Strict. A strict
#   cookie is NOT sent on cross-site requests, so if the frontend called Render
#   directly the browser would silently refuse to send it. Every access token
#   would expire after fifteen minutes and never refresh, and people would be
#   logged out mid-task with no error to explain why.
#
#   Proxying keeps everything same-origin, so the cookie is set on this domain
#   and sent back normally. It also removes CORS from the picture entirely.
#
# ORDER MATTERS: Netlify applies redirects top to bottom, so this must sit above
# the single-page-app fallback below. Otherwise /api/* would be answered with
# index.html and every API call would receive a page of HTML.
#
# ⚠️ CHANGE THIS if the Render service URL ever changes. Netlify does not expand
#    environment variables inside netlify.toml, so it has to be written out.
# -----------------------------------------------------------------------------
[[redirects]]
  from = "/api/*"
  to = "https://ocs-api-i654.onrender.com/api/:splat"
  status = 200
  force = true

# Health checks, so the backend can be verified from this domain too.
[[redirects]]
  from = "/readyz"
  to = "https://ocs-api-i654.onrender.com/readyz"
  status = 200
  force = true

# Health checks the backend actually publishes.
#
# Without these three rules, /healthz, /healthz/queue and /healthz/deep fall
# through to the single-page-app rule at the bottom and are answered with
# app.html and HTTP 200. An uptime monitor pointed at this domain therefore
# reports green no matter what the API is doing -- which is the single most
# dangerous kind of monitoring, because it produces confidence rather than
# silence. Verified 22 Aug 2026: all three returned text/html 200 before this.
[[redirects]]
  from = "/healthz"
  to = "https://ocs-api-i654.onrender.com/healthz"
  status = 200
  force = true

[[redirects]]
  from = "/healthz/*"
  to = "https://ocs-api-i654.onrender.com/healthz/:splat"
  status = 200
  force = true

# Which commit is actually serving.
#
# This one matters more than it looks. A failed Render build leaves the
# PREVIOUS deploy running with health checks green, so /readyz answering does
# not mean the API is current -- and the only other place the live commit
# appears is the Render dashboard, behind a login. Proxying /version here puts
# it on a domain an unattended check can reach without a browser or a
# credential, which is the whole reason the endpoint exists.
[[redirects]]
  from = "/version"
  to = "https://ocs-api-i654.onrender.com/version"
  status = 200
  force = true

# -----------------------------------------------------------------------------
# Clean URLs for the public marketing site.
#
# `/pricing` is the address a person types and links to; `/pricing.html` is an
# implementation detail that does not belong in the URL bar. These sit above the
# app fallback so the marketing pages win their own paths.
# -----------------------------------------------------------------------------
[[redirects]]
  from = "/how-it-works"
  to = "/how-it-works.html"
  status = 200

[[redirects]]
  from = "/pricing"
  to = "/pricing.html"
  status = 200

[[redirects]]
  from = "/demo"
  to = "/demo.html"
  status = 200

# Single-page-app fallback. The React router owns every path the marketing site
# does not, so anything that is not a real file returns the application shell
# and the app renders the right screen.
#
# Note this is app.html, NOT index.html. The root now belongs to the marketing
# site: someone who has never heard of us should land on a page that explains
# what we do, not on a sign-in screen for a product they do not have yet.
# Must be LAST.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

# -----------------------------------------------------------------------------
# Security headers.
#
# Carried over from the previous deployment, which had these right.
# geolocation and camera are granted to `self` deliberately: site supervisors
# check in with GPS and photograph the work from their phones, and without
# these the browser blocks both.
# -----------------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(self)"

# Hashed asset filenames change whenever the content changes, so they are safe
# to cache indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The shell must never be cached: a stale app.html pointing at asset hashes
# that no longer exist is the classic white-screen-after-deploy.
[[headers]]
  for = "/app.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# The service worker must never be cached either, and for a worse reason than
# the shell: a stale worker is STICKY. The browser keeps running the old one and
# serving whatever it decides to serve, so a cached sw.js can pin a supervisor's
# phone to a previous version of the app for as long as its own cache lives --
# and the usual fix, "reload the page", is exactly what it intercepts.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Service-Worker-Allowed = "/"

# Content type matters here: browsers ignore a manifest served as text/plain,
# and the symptom is an install prompt that silently never appears.
[[headers]]
  for = "/app.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# The marketing pages are regenerated on every deploy and are the first thing a
# prospect sees, so a stale copy is worse than a revalidation request.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
